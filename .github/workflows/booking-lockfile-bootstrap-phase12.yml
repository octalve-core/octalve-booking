name: Booking lockfile dependency bootstrap
on:
  push:
    branches: ['phase/12-production-foundations-booking-payments-integrations']
    paths: ['.github/workflows/booking-lockfile-bootstrap-phase12.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate consistent runtime Postgres driver lockfile
        run: |
          set -euo pipefail
          pnpm add --save-exact pg@8.16.3
          pnpm add --save-dev --save-exact @types/pg@8.15.5
          pnpm install --frozen-lockfile
      - name: Commit generated lockfile to phase branch only
        run: |
          set -euo pipefail
          git config user.name "octalve-ci-lockfile"
          git config user.email "octalve-ci-lockfile@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build(booking): pin postgres driver and generated pnpm lockfile [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
