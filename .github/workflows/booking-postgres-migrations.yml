name: Booking PostgreSQL migration acceptance
on:
  push:
    branches: ['phase/11-*', 'phase/12-*', 'review/booking', 'main']
  workflow_dispatch:
concurrency:
  group: booking-postgres-migrations-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: booking_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: booking_ci
      PGUSER: postgres
      PGPASSWORD: booking_ci_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply all migrations against real PostgreSQL 16
        run: |
          set -euo pipefail
          for file in db/migrations/*.sql; do
            echo "Applying: $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Confirm database schema and RLS policy guards
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM pg_tables WHERE schemaname IN ('booking_auth','booking_core','booking_payments','booking_integrations');
            IF n != 27 THEN RAISE EXCEPTION 'Expected 27 tables, found %', n; END IF;
            SELECT count(*) INTO n FROM pg_class c
            JOIN pg_namespace ns ON ns.oid=c.relnamespace
            WHERE ns.nspname IN ('booking_auth','booking_core','booking_payments','booking_integrations') AND c.relkind='r'
             AND c.relrowsecurity AND c.relforcerowsecurity;
            IF n != 27 THEN RAISE EXCEPTION 'Expected FORCE RLS on 27 tables, found %', n; END IF;
          END $$;
          INSERT INTO booking_auth.users(email,full_name,phone_e164)
            VALUES ('valid@booking.example','Booking Example','+2348012345678');
          CREATE ROLE booking_ci_unprivileged NOLOGIN;
          SQL
          if psql -X -v ON_ERROR_STOP=1 -c "SET ROLE booking_ci_unprivileged; SELECT id FROM booking_auth.users LIMIT 1;"; then
            echo "SECURITY FAILURE: unprivileged database role was able to read identities"
            exit 1
          fi
          if psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO booking_auth.users(email,full_name,phone_e164) VALUES ('invalid@booking.example','Booking Example','08012345678');"; then
            echo "SECURITY FAILURE: invalid E.164 phone was accepted"
            exit 1
          fi
          echo "All migration checks passed: real PostgreSQL schema, forced RLS, denied public read, E.164 validation."

      - name: Test atomic slot exclusion, tenant FKs and payment uniqueness
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $slot_check$
          DECLARE
           w uuid;svc uuid;staff uuid;customer uuid;slot uuid;
          BEGIN
           INSERT INTO booking_auth.workspaces(name,slug,kind)
             VALUES('Acceptance Workspace','ci-acceptance','business') RETURNING id INTO w;
           INSERT INTO booking_core.services(workspace_id,name,duration_minutes,payment_policy,price_minor)
             VALUES(w,'Intro Call',30,'free',0) RETURNING id INTO svc;
           INSERT INTO booking_core.staff(workspace_id,display_name)
             VALUES(w,'Staff Member') RETURNING id INTO staff;
           INSERT INTO booking_core.clients(workspace_id,full_name,email)
             VALUES(w,'Test Client','test-client@invalid.example') RETURNING id INTO customer;
           INSERT INTO booking_core.slot_claims(workspace_id,service_id,staff_id,client_id,starts_at,ends_at,
             occupied_range,hold_expires_at,idempotency_digest)
             VALUES(w,svc,staff,customer,'2026-12-01 10:00+00','2026-12-01 10:30+00',
                tstzrange('2026-12-01 09:50+00','2026-12-01 10:40+00','[)'),
                '2026-12-01 09:59+00',repeat('a',64)) RETURNING id INTO slot;
           BEGIN
            INSERT INTO booking_core.slot_claims(workspace_id,service_id,staff_id,client_id,starts_at,ends_at,
              occupied_range,hold_expires_at,idempotency_digest)
              VALUES(w,svc,staff,customer,'2026-12-01 10:30+00','2026-12-01 11:00+00',
                tstzrange('2026-12-01 10:30+00','2026-12-01 11:00+00','[)'),
                '2026-12-01 10:29+00',repeat('b',64));
            RAISE EXCEPTION 'Double booking overlap unexpectedly permitted';
           EXCEPTION WHEN exclusion_violation THEN
            NULL;
           END;
           UPDATE booking_core.slot_claims SET state='released' WHERE id=slot;
           INSERT INTO booking_core.slot_claims(workspace_id,service_id,staff_id,client_id,starts_at,ends_at,
             occupied_range,hold_expires_at,idempotency_digest)
             VALUES(w,svc,staff,customer,'2026-12-01 10:30+00','2026-12-01 11:00+00',
                tstzrange('2026-12-01 10:30+00','2026-12-01 11:00+00','[)'),
                '2026-12-01 10:29+00',repeat('c',64));
          END $slot_check$;
          SQL
          echo "Booking slot overlap and release tests passed."

