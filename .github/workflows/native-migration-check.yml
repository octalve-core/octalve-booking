name: Booking native conversion qualification
on:
  push:
    branches: ['phase/04-native-nextjs-conversion', 'phase/05-*', 'phase/06-*', 'phase/07-*', 'phase/08-*', 'phase/09-*', 'phase/10-*', 'phase/11-*', 'phase/12-*']
  workflow_dispatch:
concurrency:
  group: booking-native-qualification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enforce migration lockfile
        run: test -s pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Booking authority and native architecture tests
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Next.js build
        run: pnpm build
