name: Booking native continuous browser journey
on:
  push:
    branches: ['review/booking', 'phase/05-booking-ui-parity-accessibility', 'phase/06-*', 'phase/07-*']
  workflow_dispatch:
concurrency:
  group: booking-native-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'octalve-core/octalve-booking'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Booking app
        run: |
          pnpm start --hostname 127.0.0.1 >/tmp/booking-next.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then exit 0; fi; sleep 2; done
          tail -100 /tmp/booking-next.log
          exit 1
      - name: Responsive and keyboard regression (320, 390, 768, 1440)
        run: node scripts/native-responsive-regression.mjs
      - name: Auth and sidebar responsive browser journey
        run: node scripts/native-auth-browser-check.mjs
      - name: One continuous browser-only walkthrough (no recording)
        run: node scripts/native-browser-walkthrough.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: booking-native-browser-evidence
          path: browser-evidence/
          retention-days: 14
          if-no-files-found: warn
