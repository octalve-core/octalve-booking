name: Booking native migration dependency lockfile
on:
  push:
    branches: ['phase/04-native-nextjs-conversion']
  workflow_dispatch:
concurrency:
  group: booking-native-lock-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'octalve-core/octalve-booking'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve native dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only if changed
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(booking): pin native Next.js and Tailwind dependencies'
          git push origin HEAD:refs/heads/phase/04-native-nextjs-conversion
