name: Booking source and payment authority tests
on:
  push:
    branches: [main, 'phase/**', 'review/**']
  pull_request:
    branches: [main]
concurrency:
  group: booking-source-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
