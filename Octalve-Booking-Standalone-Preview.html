consultation','create-service'],['link','Share your booking link','Send clients a simple way to book','public'],['file','Edit enquiry questions','Ask for the information you actually need','enquiries'],['plug','Connect your tools','Payments, calendars and messaging','integrations']].map(x=>`<button data-action="${x[3]}" class="shortcut"><span class="round-icon">${I(x[0])}</span><span><b>${x[1]}</b><small>${x[2]}</small></span>${I('chevron')}</button>`).join('')}</div></section></div>`}
function bookingRows(list){return `<div class="table-wrap"><table class="table"><thead><tr><th>Booking</th><th>Client</th><th>Service</th><th>Date & time</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><button class="td-blue" data-booking="${b.id}">${b.id}</button></td><td class="td-strong">${esc(b.name)}</td><td>${esc(b.service)}</td><td>${esc(b.date)}<br><span class="right-note">${esc(b.time)}</span></td><td class="td-strong">${money(b.amount)}</td><td>${chip(b.status)}</td><td><button class="top-btn" data-booking="${b.id}" aria-label="View booking ${b.id}">${I('more')}</button></td></tr>`).join('')}</tbody></table></div><div class="mobile-cards">${list.map(b=>`<button class="record-card" data-booking="${b.id}" style="width:100%;text-align:left"><span class="record-symbol">${I('calendar')}</span><span class="record-card-main"><strong>${esc(b.name)}</strong><small>${esc(b.service)}<br>${esc(b.date)} · ${esc(b.time)}<br>${esc(b.id)}</small></span><span class="trailing"><b>${money(b.amount)}</b>${chip(b.status)}</span></button>`).join('')}</div>`}

function bookings(){const list=s.bookings.filter(b=>(s.tab==='All'||b.status===s.tab)&&[b.name,b.service,b.id].some(v=>v.toLowerCase().includes(s.query.toLowerCase())));return `${pageHead('Bookings','A complete view of appointments, client details, payment requests and confirmations.',actionBtn(`${I('external')} Booking page`,'public','btn')+actionBtn(`${I('plus')} New booking`,'public','btn btn-primary'))}<div class="panel">${filterButtons(['All','Confirmed','Awaiting bank review','Awaiting payment','Cancelled'])}<div class="table-tools"><span class="count">${list.length} bookings</span><label class="input-shell" style="width:290px;max-width:100%">${I('search')}<input placeholder="Search client or service" value="${esc(s.query)}" data-query="1"></label><div class="grow"></div>${actionBtn(`${I('filter')} Filters`,'filters','btn btn-sm')}</div>${bookingRows(list)}<div class="table-footer"><span>Showing ${list.length} of ${s.bookings.length}</span><span>Page 1 of 1</span></div></div>`}
function services(){return `${pageHead('Services','Create bookable services with flexible prices, questions, meeting formats and scheduling rules.',actionBtn(`${I('plus')} Create service`,'create-service','btn btn-primary'))}<div class="notice" style="margin-bottom:20px">${I('info')}<span>Set a service price to <strong>₦0</strong> to offer free consultations. For paid services, choose full payment, a deposit, or a merchant-reviewed bank transfer.</span></div><div class="services-grid">${s.services.length===0?'<div class="empty-list">No services published. Create a service here to explore the configuration, then connect your account to publish it.</div>':''}${s.services.map(x=>`<article class="panel service"><div class="row-between"><span class="icon-box">${I(x.icon)}</span>${chip(x.price===0?'Free consultation':money(x.price),x.price===0?'free':'neutral')}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div style="height:15px"></div><div class="service-foot"><div><span class="price">${money(x.price)}</span><span class="duration"> · ${x.duration} mins</span></div>${actionBtn(`Edit ${I('chevron')}`,'edit:'+x.id,'btn btn-ghost btn-sm')}</div></article>`).join('')}</div>`}
function enquiries(){const questions={Consulting:['What challenge would you like help solving?','What outcome would make this meeting valuable?','When do you need a solution?','What budget range have you set aside?'],Creative:['What are you trying to create?','Do you have reference examples or existing brand assets?','When do you need the first deliverable?','What is your expected project budget?'],Legal:['What type of legal service do you need?','What is the relevant deadline?','Do you already have supporting documents?','What would you like clarified during this consultation?'],Personal:['What would you like to discuss?','What would be a useful outcome?','Is there anything we should know to prepare?']};return `${pageHead('Enquiries & intake','Ask purposeful questions so every booking arrives with enough context to be productive.',actionBtn(`${I('plus')} Add question`,'add-question','btn btn-primary'))}<div class="two-panels"><section class="panel panel-pad"><div class="section-title"><div><h2>Booking enquiry builder</h2><p class="panel-note">Choose a template, then personalise the questions.</p></div></div><div class="field"><label>Enquiry type</label><select data-intake-choice="1">${Object.keys(questions).map(q=>`<option ${s.intakeChoice===q?'selected':''}>${q}</option>`).join('')}</select></div><div style="margin-top:16px">${[...questions[s.intakeChoice],...s.extraQuestions].map((q,i)=>`<div class="mini-step"><span class="mini-step-number">${i+1}</span><div class="grow"><b>${esc(q)}</b><small>${i===0?'Required':'Can be made optional per service'}</small></div>${I('edit')}</div>`).join('')}</div><div class="notice neutral" style="margin-top:18px">${I('shield')}<span>Only ask what is needed to deliver the service. Medical, legal and other sensitive information needs explicit purpose and appropriate protections.</span></div></section><section class="panel panel-pad"><div class="section-title"><div><h2>Recent enquiries</h2><p class="panel-note">Client context alongside their booking history.</p></div></div>${(localReview?sampleEnquiries:[]).map(x=>`<button class="list-row" style="width:100%;text-align:left" data-action="enquiry:${esc(x.name)}"><span class="record-symbol">${I('file')}</span><div class="grow"><strong>${esc(x.name)}</strong><div class="item-sub">${esc(x.topic)} · ${esc(x.budget)}</div></div>${chip(x.status,x.status==='New'?'pending':'neutral')}</button>`).join('')}</section></div>`}
function integrations(){return `${pageHead('Integrations','Choose the services that match your business. Connect only what you need.',actionBtn(`${I('upload')} Import schedule`,'import-schedule','btn')+actionBtn(`${I('checkcircle')} Integration setup`,'setup','btn btn-subtle'))}<div class="notice" style="margin-bottom:18px">${I('shield')}<span>Provider access is activated only after secure connection and verification. Octalve Booking remains usable independently of Finance, EMR, and third-party calendars.</span></div>${['Payments','Calendar','Messaging','Octalve'].map(category=>`<div class="group-head"><div><h2>${category==='Calendar'?'Calendars & migration':category==='Messaging'?'Messages & notifications':category==='Octalve'?'Other Octalve products':category}</h2><p>${category==='Payments'?'Gateway payments or direct bank transfer with merchant approval':category==='Calendar'?'Sync availability or move from another scheduling tool':category==='Messaging'?'Select your preferred channels and fallback rules':'Optional authorised connections; each application runs independently'}</p></div></div><div class="integrations-grid">${cards.filter(c=>c.category===category).map(c=>`<article class="panel integration"><span class="app-icon">${c.icon}</span><div class="int-grow"><h3>${c.name}</h3><p>${c.desc}</p>${chip(c.status,'neutral')}<div style="margin-top:3px">${actionBtn(`Set up ${I('chevron')}`,'connect:'+c.name,'btn btn-sm')}</div></div></article>`).join('')}</div>`).join('')}`}
function payments(){return `${pageHead('Payments','Track booking fees, pending collection requests and reconciliation tasks.',actionBtn(`${I('plus')} Add payment method`,'integrations','btn btn-primary'))}<div class="grid-stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="panel stat"><div class="label">Confirmed bookings</div><div class="number">${localReview?'18':'0'}</div><div class="delta">Booking status, not settled payouts</div></div><div class="panel stat"><div class="label">Pending bank reviews</div><div class="number">${localReview?'3':'0'}</div><div class="delta">Customer claims require bank evidence</div></div><div class="panel stat"><div class="label">Free consultations</div><div class="number">${localReview?'4':'0'}</div><div class="delta">No payment collection required</div></div></div><div class="panel panel-pad"><div class="section-title"><h2>Collection rules</h2>${actionBtn('Configure methods','integrations','btn btn-sm')}</div><div class="shortcut-list"><div class="shortcut"><span class="round-icon">${I('checkcircle')}</span><span><b>Gateway payment</b><small>Confirm only after an authenticated provider event and independent verification.</small></span>${chip('Automatic','free')}</div><div class="shortcut"><span class="round-icon">${I('wallet')}</span><span><b>Merchant bank transfer</b><small>Temporary review hold only. Client sees pending payment; confirmation requires evidence and conflict-safe approval.</small></span>${chip('Manual review','pending')}</div><div class="shortcut"><span class="round-icon">${I('check')}</span><span><b>Free appointment (₦0)</b><small>Confirm availability without a payment step, subject to event rules.</small></span>${chip('No payment','confirmed')}</div></div></div>`}

function clients(){return `${pageHead('Clients','Keep a clear history of who booked and what each meeting is about.',actionBtn(`${I('download')} Export`,'export','btn'))}<div class="panel">${bookingRows(s.bookings.filter((b,i,arr)=>arr.findIndex(x=>x.name===b.name)===i))}</div>`}

function settings(){return `${pageHead('Workspace settings','Manage your business identity, booking policies, privacy and account preferences.')}<div class="two-panels"><div class="panel panel-pad"><div class="section-title"><h2>Business identity</h2></div><div class="form-grid"><div class="field full"><label>Business or individual name</label><input value="${localReview?'Octalve Studio':'Not configured'}" disabled><small>Editable when account management is activated.</small></div><div class="field"><label>Time zone</label><select disabled><option>Africa/Lagos (GMT+1)</option></select></div><div class="field"><label>Currency</label><select disabled><option>Nigerian Naira (NGN)</option></select></div><div class="field full"><label>Booking page address</label><input value="${localReview?'Example address: /b/octalve-studio':'Address assigned after publishing'}" disabled></div></div><div class="notice neutral" style="margin-top:19px">${I('shield')}<span>Connection credentials and business settings are protected by server-side authorization once the account system is enabled.</span></div></div><div class="panel panel-pad"><h2 class="panel-title">Booking rules</h2><div class="shortcut-list">${[['clock','Minimum notice','24 hours before the appointment'],['calendar','Advance bookings','Up to 30 days'],['refresh','Cancellation policy','24-hour cancellation window'],['wallet','Manual transfer requests','Pending until the merchant verifies payment']].map(x=>`<div class="shortcut"><span class="round-icon">${I(x[0])}</span><span><b>${x[1]}</b><small>${x[2]}</small></span></div>`).join('')}</div></div></div>`}

function publicHeader(){return `<div class="public-head"><div class="row"><span class="mark" style="width:33px;height:33px"></span><strong class="brand-name" style="font-size:17px">Octalve<span style="color:var(--blue)">.</span> <span style="font-size:11px;color:var(--blue);letter-spacing:0">Booking</span></strong></div>${localReview?actionBtn(`${I('arrow')} Back to workspace`,'overview','btn btn-sm'):''}</div>`}
function publicBooking(){if(!localReview)return `<div class="public-page">${publicHeader()}<main class="booking-unavailable"><div class="unavailable-icon">${I('calendar')}</div><h1 class="page-title">Booking is not yet available</h1><p class="page-description">This booking page is not accepting new appointments. Please contact the host directly for availability.</p></main></div>`;const svc=s.services.find(x=>x.id===s.selectedService)||s.services[0];const dates=Array.from({length:5},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return {day:new Intl.DateTimeFormat('en-GB',{weekday:'short',timeZone:'Africa/Lagos'}).format(d),number:new Intl.DateTimeFormat('en-GB',{day:'numeric',timeZone:'Africa/Lagos'}).format(d),full:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'Africa/Lagos'}).format(d)}}),times=['9:00 AM','10:00 AM','11:30 AM','1:00 PM','2:30 PM','4:00 PM'];let inner='';if(s.publicStep===0)inner=`<h2 class="panel-title">Choose a service</h2><p class="page-description">Select the session that best fits your needs.</p><div style="margin-top:17px">${s.services.map(x=>`<button class="public-service ${svc.id===x.id?'chosen':''}" data-select-service="${x.id}"><div><h4>${esc(x.title)}</h4><p>${esc(x.duration)} minutes · ${esc(x.location)}</p></div><b>${money(x.price)}</b></button>`).join('')}</div>`;
if(s.publicStep===1)inner=`<h2 class="panel-title">Find a time that works</h2><p class="page-description">Choose an available date and time for ${esc(svc.title.toLowerCase())}.</p><div class="date-strip">${dates.map((d,i)=>`<button class="day-button ${s.selectedDate===i?'selected':''}" data-date="${i}">${d.day}<b>${d.number}</b></button>`).join('')}</div><h3 style="margin-top:27px;font-size:12px">Times shown for layout review · Africa/Lagos</h3><div class="time-grid">${times.map(t=>`<button class="time-button ${s.selectedTime===t?'selected':''}" data-time="${t}">${t}</button>`).join('')}</div>`;
if(s.publicStep===2)inner=`<h2 class="panel-title">Tell us a little about your enquiry</h2><p class="page-description">A few useful details help the host prepare a better session.</p><form class="form-grid" style="margin-top:19px" id="booking-intake"><div class="field"><label>Your name</label><input name="name" placeholder="Full name" autocomplete="name" required value="${esc(s.previewForm.name||'')}"></div><div class="field"><label>Email address</label><input name="email" type="email" placeholder="you@example.com" autocomplete="email" required value="${esc(s.previewForm.email||'')}"></div><div class="field"><label>Phone number (optional)</label><input name="phone" placeholder="+234…" autocomplete="tel" value="${esc(s.previewForm.phone||'')}"></div><div class="field"><label>Project type</label><select name="project"><option>Consultation</option><option>New project</option><option>Existing client support</option><option>Other</option></select></div><div class="field full"><label>What would you like to achieve?</label><textarea name="goal" placeholder="A short description is enough…" required>${esc(s.previewForm.goal||'')}</textarea></div><div class="field full"><label>When would you like to begin?</label><select name="urgency"><option>As soon as possible</option><option>Within a month</option><option>In 1–3 months</option><option>Just exploring</option></select></div></form>`;
if(s.publicStep===3)inner=`<h2 class="panel-title">Review your booking request</h2><p class="page-description">Check the details and the payment requirements before submitting.</p><div style="margin-top:18px">${[['Service',svc.title],['Date',dates[s.selectedDate].full],['Time',s.selectedTime+' (Africa/Lagos)'],['Duration',svc.duration+' minutes'],['Service price',money(svc.price)],['Amount due now',svc.price===0?'₦0':money(svc.deposit===100?svc.price:svc.price*svc.deposit/100)]].map(x=>`<div class="summary-line"><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div>${svc.price===0?`<div class="notice" style="margin-top:16px">${I('checkcircle')}<span>This consultation is free. No payment will be requested.</span></div>`:svc.deposit===0?`<div class="notice warning" style="margin-top:16px">${I('clock')}<span>No payment is due today, but this is a paid service. The host must approve the pay-later arrangement before your appointment is confirmed.</span></div>`:`<div style="margin-top:18px"><h3 style="font-size:12px;margin-bottom:11px">Preferred payment method</h3><div class="option-group"><label class="choice ${s.paymentChoice==='gateway'?'checked':''}"><input type="radio" name="pay" value="gateway" ${s.paymentChoice==='gateway'?'checked':''}> Online gateway</label><label class="choice ${s.paymentChoice==='bank'?'checked':''}"><input type="radio" name="pay" value="bank" ${s.paymentChoice==='bank'?'checked':''}> Bank transfer</label></div>${s.paymentChoice==='bank'?`<div class="notice warning" style="margin-top:14px">${I('warning')}<span>Bank transfer bookings remain <strong>awaiting review</strong>. A short review hold is not a confirmed appointment; the merchant must verify the funds and recheck availability before approval.</span></div>`:`<div class="notice" style="margin-top:14px">${I('shield')}<span>Online payment must be verified by the connected gateway before the booking is confirmed.</span></div>`}</div>`}`;
return `<div class="public-page">${publicHeader()}<div class="public-wrap"><aside class="public-side"><div class="host-circle">OS</div><div class="eyebrow" style="margin-bottom:7px">BOOK WITH</div><h2>Octalve Studio</h2><p>Book a conversation that moves things forward. Pick the right service, tell us what you need and choose a convenient time.</p><div class="detail">${I('clock')} ${svc.duration} minutes</div><div class="detail">${I('globe')} Africa/Lagos</div><div class="detail">${I('wallet')} ${money(svc.price)}</div><div class="notice neutral" style="margin-top:28px">${I('info')}<span>New reservations are available when the host activates booking services. No personal information is transmitted from this page.</span></div></aside><main class="public-content"><div class="steps">${[0,1,2,3].map(i=>`<span class="step ${s.publicStep>=i?'on':''}"></span>`).join('')}</div>${inner}<div class="public-actions">${s.publicStep===0?'<span class="right-note">Step 1 of 4</span>':actionBtn(`${I('chevron')} Back`,'back-step','btn btn-sm')}<div class="grow"></div>${actionBtn(s.publicStep===3?`Review complete ${I('check')}`:`Continue ${I('arrow')}` ,s.publicStep===3?'finish-request':'next-step','btn btn-primary')}</div></main></div></div>`}
function dialogContent(){if(!s.modal)return '';let title='',body='',footer='';const [type,arg]=s.modal.split(':');if(type==='booking'){const b=s.bookings.find(x=>x.id===arg);if(!b)return '';title='Booking '+b.id;body=`<div class="row-between" style="margin-bottom:18px"><div><h3 style="font-size:16px">${esc(b.name)}</h3><p class="page-description">${esc(b.service)}</p></div>${chip(b.status)}</div>${[['Date',b.date],['Time',b.time+' (Africa/Lagos)'],['Service price',money(b.amount)],['Payment evidence',b.payment],['Client email',b.email],['Enquiry',b.brief]].map(x=>`<div class="summary-line"><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('')}${b.status==='Awaiting bank review'?`<div class="notice warning" style="margin-top:18px">${I('warning')}<span>Payment has not been verified. A bank screenshot is not proof of settlement, and a temporary review window does not guarantee this time.</span></div>`:''}`;footer=actionBtn('Close','close-modal','btn')+ (b.status==='Awaiting bank review'?actionBtn('Review transfer requirements','manual-approve-info','btn btn-primary'):'');}
else if(type==='connect'){const c=cards.find(x=>x.name===arg);title=c?.name||'Integration';body=`<div class="row" style="margin-bottom:17px"><span class="app-icon" style="height:42px;width:42px;background:#EDF5FF;color:var(--blue);display:grid;place-items:center;border-radius:12px;font-weight:800">${esc(c?.icon||'')}</span><div><strong>${esc(c?.name||'')}</strong><div class="item-sub">Connection status: Not connected</div></div></div><p style="font-size:12px;line-height:1.8;color:#5c7088">${esc(c?.detail||'')}</p><div class="notice warning" style="margin-top:18px">${I('lock')}<span>Secure connection requires a configured backend and verified permissions. Credentials are never collected in an unprotected browser form.</span></div>`;footer=actionBtn('Close','close-modal','btn');}
else if(type==='service'){const existing=s.services.find(x=>x.id===arg);title=existing?'Edit service':'Create service';body=`<form id="service-form" class="form-grid"><div class="field full"><label>Service name</label><input name="title" maxlength="100" value="${esc(existing?.title||'')}" placeholder="e.g. Free 15-minute discovery call" required></div><div class="field full"><label>Description</label><textarea name="desc" maxlength="400" placeholder="Tell clients what they will accomplish…">${esc(existing?.desc||'')}</textarea></div><div class="field"><label>Duration</label><select name="duration">${[15,20,30,45,60,90,120].map(n=>`<option value="${n}" ${(existing?.duration||30)===n?'selected':''}>${n} minutes</option>`).join('')}</select></div><div class="field"><label>Price (NGN)</label><input name="price" type="number" min="0" step="1" value="${esc(existing?.price??0)}" required><small>₦0 means a free consultation.</small></div><div class="field"><label>Payment required upfront</label><select name="deposit"><option value="0" ${existing?.deposit===0?'selected':''}>No upfront payment</option><option value="50" ${existing?.deposit===50?'selected':''}>50% deposit</option><option value="100" ${existing?.deposit===100?'selected':''}>Full payment</option></select></div><div class="field"><label>Meeting format</label><select name="location"><option>Video meeting</option><option>Phone call</option><option>In person</option></select></div></form><div class="notice neutral" style="margin-top:17px">${I('info')}<span>Edits to services in this local workspace are not published or saved to a business account.</span></div>`;footer=actionBtn('Cancel','close-modal','btn')+actionBtn(`${I('check')} Apply to this view`,'save-service','btn btn-primary');s.editId=existing?.id||null;}
else if(type==='import'){title='Import your existing bookings';body=`<p style="color:#61758c;line-height:1.7;font-size:12px">Bring a supported Calendly, Cal.com or calendar export. Review and map the data before importing to an active account.</p><div class="field" style="margin-top:18px"><label>CSV or iCalendar (.ics) file</label><input type="file" id="schedule-file" accept=".csv,.ics,text/csv,text/calendar"><small>Read locally in this browser. The file is not uploaded.</small></div><div class="notice neutral" style="margin-top:15px">${I('info')}<span>Calendar entries and existing customer bookings have different meanings. A migration must map service, timezone, host, cancellation and payment states before publishing.</span></div><div id="import-result" style="margin-top:12px"></div>`;footer=actionBtn('Close','close-modal','btn')+actionBtn(`${I('eye')} Inspect file`,'inspect-import','btn btn-primary');}
else if(type==='question'){title='Add an enquiry question';body=`<div class="field"><label>Question</label><input id="new-question" maxlength="180" placeholder="What should we know before we meet?"></div><p class="page-description" style="margin-top:13px">This question is shown in your current intake builder view.</p>`;footer=actionBtn('Cancel','close-modal','btn')+actionBtn('Add question','save-question','btn btn-primary');}
else if(type==='filters'){title='Booking filters';body=`<div class="field"><label>Filter by status</label><select id="filter-modal">${['All','Confirmed','Awaiting bank review','Awaiting payment','Cancelled'].map(t=>`<option ${s.tab===t?'selected':''}>${t}</option>`).join('')}</select></div>`;footer=actionBtn('Apply','apply-filter','btn btn-primary');}
else {title='Workspace information';body=`<div class="notice">${I('info')}<span>Live actions become available when the business account, secure server and required integrations are configured. Payments, booking confirmations and messages are unavailable until the required services have been securely activated.</span></div>`;footer=actionBtn('Close','close-modal','btn')}
return `<div class="dialog-overlay" data-action="close-modal"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="dialog"><div class="dialog-hd"><h2>${esc(title)}</h2><button class="top-btn" data-action="close-modal" aria-label="Close">${I('close')}</button></div><div class="dialog-bd">${body}</div><div class="dialog-footer">${footer}</div></section></div>`}
function render(){if(s.page==='public'){root.innerHTML=publicBooking()+dialogContent();return;}const pages={overview,bookings,calendar,services,enquiries,clients,payments,integrations,reports,setup,settings};root.innerHTML=`<div class="app">${header()}${sidebar()}<main class="main" id="main-content">${(pages[s.page]||overview)()}</main>${mobileNav()}</div>${dialogContent()}`;}
function interceptAction(action){if(!action)return;
if(['overview','bookings','calendar','services','enquiries','clients','payments','integrations','reports','setup','settings','public'].includes(action)){setPage(action);return}
if(action==='menu'){s.mobileMenu=!s.mobileMenu;render();return}if(action==='close-menu'){s.mobileMenu=false;render();return}
if(action==='create-service'){s.modal='service:new';render();return}if(action.startsWith('edit:')){s.modal='service:'+action.split(':')[1];render();return}
if(action.startsWith('enquiry:')){s.modal='enquiry';render();return}
if(action==='add-question'){s.modal='question';render();return}
if(action==='import-schedule'){s.modal='import';render();return}
if(action==='inspect-import'){const f=document.getElementById('schedule-file')?.files?.[0];if(!f){notify('Choose a CSV or ICS file');return}if(f.size>1024*1024){notify('File too large','Choose a file under 1 MB for this local inspection.');return}if(!/\.(csv|ics)$/i.test(f.name)){notify('Unsupported file','Choose CSV or ICS.');return}const reader=new FileReader();reader.onload=()=>{const v=String(reader.result||'');const count=f.name.toLowerCase().endsWith('.ics')?(v.match(/BEGIN:VEVENT/g)||[]).length:Math.max(0,v.split(/\r?\n/).filter(Boolean).length-1);const result=document.getElementById('import-result');if(result)result.innerHTML=`<div class="notice">${I('checkcircle')}<span><strong>${count} entries detected.</strong> File inspection is local; no bookings have been imported. A secure server-side validation and mapping step is required to apply this data.</span></div>`};reader.readAsText(f);return}
if(action==='save-question'){const val=document.getElementById('new-question')?.value?.trim();if(!val){notify('Enter a question first');return}s.extraQuestions.push(val);s.modal=null;render();notify('Question added to this view','It has not been published.');return}
if(action==='save-service'){const f=document.getElementById('service-form');if(!f||!f.reportValidity())return;const d=new FormData(f);const price=Number(d.get('price'));if(!Number.isFinite(price)||price<0){notify('Enter a valid price');return}const obj={id:s.editId||'s'+Date.now(),title:String(d.get('title')).trim(),desc:String(d.get('desc')).trim(),price,duration:Number(d.get('duration')),deposit:price===0?0:Number(d.get('deposit')),location:String(d.get('location')),icon:'briefcase',kind:'Service'};if(s.editId){s.services=s.services.map(x=>x.id===s.editId?obj:x)}else{s.services.push(obj)}s.modal=null;render();notify('Service updated in this view','To publish services, connect the business account and database.');return}
if(action==='close-modal'){s.modal=null;render();return}
if(action==='filters'){s.modal='filters';render();return}
if(action==='apply-filter'){s.tab=document.getElementById('filter-modal')?.value||'All';s.modal=null;render();return}
if(action.startsWith('connect:')){s.modal=action;render();return}
if(action==='next-step'){if(s.publicStep===2){let f=document.getElementById('booking-intake');if(!f?.reportValidity())return;s.previewForm=Object.fromEntries(new FormData(f))}s.publicStep=Math.min(s.publicStep+1,3);render();return}
if(action==='back-step'){s.publicStep=Math.max(0,s.publicStep-1);render();return}
if(action==='finish-request'){s.modal='not-ready';render();return}
if(action==='manual-approve-info'){s.modal='not-ready';render();return}
if(action==='profile'||action==='alerts'||action==='export'||action==='availability-modal'){s.modal='not-ready';render();return}
if(action==='copy-link'){s.modal='not-ready';render();return}
}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page],[data-booking],[data-filter],[data-select-service],[data-date],[data-time]');if(!el)return;if(el.classList.contains('dialog-overlay')&&e.target.closest('.dialog'))return;if(el.dataset.page){setPage(el.dataset.page);return}if(el.dataset.booking){s.modal='booking:'+el.dataset.booking;render();return}if(el.dataset.filter){s.tab=el.dataset.filter;render();return}if(el.dataset.selectService){s.selectedService=el.dataset.selectService;render();return}if(el.dataset.date){s.selectedDate=Number(el.dataset.date);render();return}if(el.dataset.time){s.selectedTime=el.dataset.time;render();return}interceptAction(el.dataset.action)});
root.addEventListener('change',e=>{if(e.target.matches('[data-intake-choice]')){s.intakeChoice=e.target.value;s.extraQuestions=[];render()}if(e.target.name==='pay'){s.paymentChoice=e.target.value;render()}});
root.addEventListener('input',e=>{if(e.target.matches('[data-query]')){s.query=e.target.value;const focus=e.target.selectionStart;render();const inp=root.querySelector('[data-query]');if(inp){inp.focus();inp.setSelectionRange(focus,focus)}}if(e.target.matches('[data-main-search]')){s.page='bookings';s.query=e.target.value;render();const inp=root.querySelector('[data-query]');inp?.focus()}});
window.addEventListener('popstate',()=>{s.page=location.pathname.startsWith('/b/')?'public':'overview';render()});
render();
})();
</script></body></html>
